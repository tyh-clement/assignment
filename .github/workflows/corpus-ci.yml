name: OrbitMesh Retrieval Pipeline CI

on:
  push:
    paths:
      - "corpus/**"
      - "src/orbitmesh/ingestion/**"
      - "src/orbitmesh/agent/**"
      - "promptfoo/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-ci.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "src/orbitmesh/ingestion/**"
      - "src/orbitmesh/agent/**"
      - "promptfoo/**"
      - "scripts/**"
      - "Makefile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/corpus-ci.yml"

jobs:
  retrieval-and-chat:
    runs-on: ubuntu-latest
    env:
      ORBITMESH_CI_MODE: "1"
      CHROMA_COLLECTION: orbitmesh_ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Configure ephemeral CI storage
        run: |
          echo "ORBITMESH_DATA_DIR=$RUNNER_TEMP/orbitmesh-data" >> "$GITHUB_ENV"
          echo "CHROMA_DIR=$RUNNER_TEMP/orbitmesh-data/chroma" >> "$GITHUB_ENV"
          echo "INGEST_STATE_PATH=$RUNNER_TEMP/orbitmesh-data/ingest_state.json" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: make setup

      - name: Build knowledge base with local embeddings
        run: make ingest

      - name: Run retrieval and idempotency checks
        run: .venv/bin/python scripts/ci_retrieval_check.py

      - name: Run contract and smoke checks
        run: make test

      - name: Run Promptfoo full evaluation
        run: make eval
