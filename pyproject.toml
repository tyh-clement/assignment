[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitmesh-bot"
version = "0.1.0"
description = "OrbitMesh RAG support chatbot"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.20",
  "python-dotenv>=1.0",
  "langgraph>=0.2",
  "openai>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
